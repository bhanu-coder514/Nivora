<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NIVORA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-home"></i> NIVORA
            </a>
        </div>
    </nav>

    <!-- Login Form -->
    <section class="py-5" style="min-height: calc(100vh - 200px);">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">
                    <div class="card shadow-lg" style="border: none; border-radius: 16px;">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <h2 class="fw-bold mb-2">Welcome Back</h2>
                                <p class="text-muted">Login to your NIVORA account</p>
                            </div>

                            <form id="loginForm">
                                <div class="form-group">
                                    <label class="form-label required">Email Address</label>
                                    <input type="email" class="form-control" name="email" required
                                           placeholder="your.email@example.com">
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label required">Password</label>
                                    <div style="position: relative;">
                                        <input type="password" class="form-control" name="password" required
                                               placeholder="Enter your password" id="passwordInput">
                                        <button type="button" class="btn btn-link"
                                                style="position: absolute; right: 0; top: 0; text-decoration: none;"
                                                onclick="togglePassword()">
                                            <i class="fas fa-eye" id="toggleIcon"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                                    <i class="fas fa-sign-in-alt me-2"></i>Login
                                </button>

                                <div class="text-center">
                                    <p class="mb-2">Don't have an account?</p>
                                    <a href="/student-register.html" class="btn btn-outline-primary me-2">
                                        Register as Student
                                    </a>
                                    <a href="/owner-register.html" class="btn btn-outline-primary">
                                        Register as Owner
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Demo Credentials -->
                    <div class="card mt-3" style="border: 2px dashed var(--primary-teal); background-color: var(--accent-light);">
                        <div class="card-body">
                            <h6 class="fw-bold mb-2">Demo Accounts:</h6>
                            <small class="d-block mb-1"><strong>Admin:</strong> admin@nivora.com / admin123</small>
                            <small class="d-block mb-1"><strong>Owner:</strong> owner@nivora.com / owner123</small>
                            <small class="d-block"><strong>Student:</strong> student@nivora.com / student123</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        // Redirect if already logged in
        redirectIfAuthenticated();

        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const email = formData.get('email');
            const password = formData.get('password');

            // Clear previous errors
            document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));

            if (!validateForm(e.target)) {
                return;
            }

            try {
                await handleLogin(email, password);
            } catch (error) {
                toast.error(error.message || 'Login failed. Please check your credentials.');
            }
        });
    </script>
</body>
</html>
