<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - NIVORA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-home"></i> NIVORA</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/add-property.html">Add Property</a></li>
                    <li class="nav-item" id="authLinks"></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="container my-4">
        <h2 class="mb-4">Owner Dashboard</h2>

        <div id="dashboardContent">
            <div class="text-center py-5">
                <div class="spinner mx-auto"></div>
                <p class="text-muted mt-3">Loading dashboard...</p>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            updateAuthUI();
            const user = await requireAuth(['owner']);
            if (user) loadDashboard();
        });

        async function loadDashboard() {
            try {
                const data = await api.get('/dashboard/owner');
                if (!data.success) throw new Error(data.message);

                const { stats, recentProperties, recentInquiries } = data;

                document.getElementById('dashboardContent').innerHTML = `
                    <div class="row g-4 mb-4">
                        <div class="col-md-3">
                            <div class="card">
                                <div class="card-body text-center">
                                    <h3 class="mb-2">${stats.totalProperties}</h3>
                                    <p class="text-muted mb-0">Total Properties</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card">
                                <div class="card-body text-center">
                                    <h3 class="mb-2 text-success">${stats.availableProperties}</h3>
                                    <p class="text-muted mb-0">Available</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card">
                                <div class="card-body text-center">
                                    <h3 class="mb-2">${stats.totalInquiries}</h3>
                                    <p class="text-muted mb-0">Total Inquiries</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card">
                                <div class="card-body text-center">
                                    <h3 class="mb-2 text-warning">${stats.pendingInquiries}</h3>
                                    <p class="text-muted mb-0">Pending</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-lg-6 mb-4">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title mb-3">Your Properties</h5>
                                    ${recentProperties.length > 0 ? recentProperties.map(p => `
                                        <div class="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom">
                                            <div>
                                                <h6 class="mb-1">${escapeHtml(p.title)}</h6>
                                                <small class="text-muted">${formatCurrency(p.monthlyRent)}/month</small>
                                            </div>
                                            <div>
                                                <a href="/room-details.html?id=${p._id}" class="btn btn-sm btn-outline-primary me-2">View</a>
                                            </div>
                                        </div>
                                    `).join('') : '<p class="text-muted">No properties yet</p>'}
                                    <a href="/add-property.html" class="btn btn-primary w-100 mt-3">Add New Property</a>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-6 mb-4">
                            <div class="card">
                                <div class="card-body">
                                    <h5 class="card-title mb-3">Recent Inquiries</h5>
                                    ${recentInquiries.length > 0 ? recentInquiries.map(inq => `
                                        <div class="mb-3 pb-3 border-bottom">
                                            <div class="d-flex justify-content-between mb-2">
                                                <strong>${escapeHtml(inq.student?.name || 'Student')}</strong>
                                                <span class="badge badge-${inq.status === 'pending' ? 'warning' : 'success'}">${inq.status}</span>
                                            </div>
                                            <p class="mb-1 small">${escapeHtml(inq.property?.title || 'Property')}</p>
                                            <p class="mb-0 text-muted small">${escapeHtml(inq.message).substring(0, 100)}...</p>
                                        </div>
                                    `).join('') : '<p class="text-muted">No inquiries yet</p>'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('dashboardContent').innerHTML = `
                    <div class="alert alert-error">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Failed to load dashboard: ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
