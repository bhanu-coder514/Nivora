<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Owner - NIVORA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-home"></i> NIVORA
            </a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="card shadow-lg" style="border: none; border-radius: 16px;">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <h2 class="fw-bold mb-2">Create Owner Account</h2>
                                <p class="text-muted">List your properties and connect with tenants</p>
                            </div>

                            <form id="registerForm">
                                <div class="form-group">
                                    <label class="form-label required">Full Name</label>
                                    <input type="text" class="form-control" name="name" required
                                           placeholder="Enter your full name">
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label required">Email Address</label>
                                    <input type="email" class="form-control" name="email" required
                                           placeholder="your.email@example.com">
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label required">Phone Number</label>
                                    <input type="tel" class="form-control" name="phone" required
                                           placeholder="10-digit mobile number" pattern="[6-9][0-9]{9}">
                                    <div class="invalid-feedback"></div>
                                    <small class="form-text">Enter a valid 10-digit Indian mobile number</small>
                                </div>

                                <div class="form-group">
                                    <label class="form-label required">Password</label>
                                    <input type="password" class="form-control" name="password" required
                                           placeholder="At least 6 characters" minlength="6">
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="form-group">
                                    <label class="form-label required">Confirm Password</label>
                                    <input type="password" class="form-control" name="confirmPassword" required
                                           placeholder="Re-enter your password">
                                    <div class="invalid-feedback"></div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                                    <i class="fas fa-user-plus me-2"></i>Create Account
                                </button>

                                <div class="text-center">
                                    <p class="mb-0">Already have an account? <a href="/login.html">Login here</a></p>
                                    <p class="mb-0 mt-2">Looking for accommodation? <a href="/student-register.html">Register as Student</a></p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        redirectIfAuthenticated();

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(e.target);
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                password: formData.get('password'),
                confirmPassword: formData.get('confirmPassword')
            };

            document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));

            if (!validateForm(e.target)) {
                return;
            }

            try {
                await handleRegister(data, 'owner');
            } catch (error) {
                toast.error(error.message || 'Registration failed');
                if (error.message.includes('email')) {
                    const emailInput = e.target.querySelector('[name="email"]');
                    emailInput.classList.add('is-invalid');
                    emailInput.nextElementSibling.textContent = error.message;
                    emailInput.nextElementSibling.style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
